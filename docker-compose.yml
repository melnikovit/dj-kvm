version: "3.8"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: djkvm
      POSTGRES_USER: djkvm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djkvm_secret_pass}
    volumes:
      - djkvm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U djkvm -d djkvm"]
      interval: 5s
      timeout: 5s
      retries: 20

  core:
    image: melnikovit/dj-kvm:latest
    restart: unless-stopped
    ports:
      - "${DJKVM_PORT:-8089}:8080"
    environment:
      DATABASE_URL: postgres://djkvm:${POSTGRES_PASSWORD:-djkvm_secret_pass}@db:5432/djkvm?sslmode=disable
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_key_in_production}
      DJKVM_SECRETS_KEY: ${DJKVM_SECRETS_KEY:-change_this_encryption_key_in_production}
    depends_on:
      db:
        condition: service_healthy

volumes:
  djkvm_db_data:
